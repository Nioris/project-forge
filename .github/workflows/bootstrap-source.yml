name: Import Project Forge Source

on:
  push:
    branches: [main]
    paths:
      - 'project-forge-v4.68.1-github-source.zip'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract reviewed source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/project-forge-source
          mkdir -p /tmp/project-forge-source
          unzip -q project-forge-v4.68.1-github-source.zip -d /tmp/project-forge-source
      - name: Replace bootstrap payload with source tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/project-forge-source/ ./
          git config user.name 'Project Forge Bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Import Project Forge v4.68.1 source'
          git push origin HEAD:main
