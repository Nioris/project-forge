name: Bootstrap Project Forge Source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-*.b64 | base64 -d > /tmp/project-forge-source.tar.xz
          mkdir -p /tmp/project-forge-source
          tar -xJf /tmp/project-forge-source.tar.xz -C /tmp/project-forge-source
      - name: Replace bootstrap payload with source tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/project-forge-source/ ./
          git config user.name 'Project Forge Bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Import Project Forge v4.68.1 source'
          git push origin HEAD:main
