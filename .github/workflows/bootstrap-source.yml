name: Import Project Forge Source

on:
  push:
    branches: [main]
    paths:
      - 'project-forge-v4.68.1.zip'
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify reviewed archive
        shell: bash
        run: |
          set -euo pipefail
          echo 'a350cf04a14dd1eb0fc73c148ebd32ef726f2e3e7fc72d972b15c3acb2767c27  project-forge-v4.68.1.zip' | sha256sum -c -

      - name: Extract and scan source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/project-forge-source
          mkdir -p /tmp/project-forge-source
          unzip -q project-forge-v4.68.1.zip -d /tmp/project-forge-source

          if find /tmp/project-forge-source -type f \( -name '*.key' -o -name '.env' -o -path '*/forge-data/secrets/*' \) | grep -q .; then
            echo 'Refusing to publish secret-bearing files.' >&2
            exit 1
          fi

          if grep -RIEq --exclude='*.lock' --exclude='package-lock.json' 'sk-ant-[A-Za-z0-9_-]{20,}|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|OPENAI_API_KEY[[:space:]]*=[[:space:]]*[^[:space:]]{20,}|ANTHROPIC_API_KEY[[:space:]]*=[[:space:]]*[^[:space:]]{20,}' /tmp/project-forge-source; then
            echo 'Refusing to publish content that looks like a credential.' >&2
            exit 1
          fi

      - name: Replace bootstrap payload with source tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='project-forge-v4.68.1.zip' \
            /tmp/project-forge-source/ ./

          cat > .gitignore <<'EOF'
          # Project Forge secrets and local state
          forge-data/
          **/forge-data/secrets/
          secrets/
          *.key
          .openai_key
          .anthropic_key
          .gigachat_key
          .gigachat_token
          .env
          .env.*
          !.env.example
          !**/.env.example

          # Local/generated state
          node_modules/
          .DS_Store
          Thumbs.db
          *.log
          *.tmp
          *.bak
          backups/
          **/backups/
          EOF

          cat > SECURITY.md <<'EOF'
          # Security

          Project Forge does not require API keys to be committed to a project repository.

          Keep credentials outside projects under `forge-data/secrets/` or in supported environment variables. Never commit `*.key`, `.env`, provider tokens, backup archives, or local `forge-data` state.

          If a credential is ever committed, revoke/rotate it at the provider first, then remove it from Git history.
          EOF

          git config user.name 'Project Forge Bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Import Project Forge v4.68.1 source'
          git push origin HEAD:main
