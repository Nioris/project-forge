name: Prepare bilingual Dashboard

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dashboard-bilingual.yml

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add bilingual Dashboard onboarding and README guidance
        shell: bash
        run: |
          set -euo pipefail

          # If the prebuilt bilingual Dashboard payload from the preparation step exists,
          # prefer it. Otherwise apply the conservative inline i18n layer below.
          if [ -f .github/dashboard-bilingual-v4.68.2.gz.b64 ]; then
            base64 -d .github/dashboard-bilingual-v4.68.2.gz.b64 | gzip -d > dashboard.html
            git rm -f .github/dashboard-bilingual-v4.68.2.gz.b64
          else
            python3 - <<'PY'
          from pathlib import Path

          path = Path('dashboard.html')
          html = path.read_text(encoding='utf-8')
          marker = 'FORGE_DASHBOARD_BILINGUAL_V1'

          if marker not in html:
              block = r'''
          <!-- FORGE_DASHBOARD_BILINGUAL_V1 -->
          <style id="forge-dashboard-i18n-style">
            #forge-lang-switch {
              position: fixed;
              top: 14px;
              right: 14px;
              z-index: 10000;
              display: inline-flex;
              align-items: center;
              gap: 4px;
              padding: 4px;
              border: 1px solid rgba(127,127,127,.28);
              border-radius: 12px;
              background: rgba(20,20,24,.88);
              backdrop-filter: blur(12px);
              box-shadow: 0 8px 24px rgba(0,0,0,.22);
              font: 600 12px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
            }
            #forge-lang-switch button {
              border: 0;
              border-radius: 8px;
              padding: 7px 9px;
              cursor: pointer;
              color: #d7d7dd;
              background: transparent;
              font: inherit;
            }
            #forge-lang-switch button[aria-pressed="true"] {
              color: #fff;
              background: rgba(255,255,255,.14);
            }
            #forge-start-guide {
              position: fixed;
              right: 14px;
              bottom: 14px;
              z-index: 9999;
              width: min(390px, calc(100vw - 28px));
              border: 1px solid rgba(127,127,127,.28);
              border-radius: 16px;
              background: rgba(20,20,24,.94);
              color: #f3f3f5;
              box-shadow: 0 14px 40px rgba(0,0,0,.3);
              font: 14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
              overflow: hidden;
            }
            #forge-start-guide details { padding: 0; }
            #forge-start-guide summary {
              cursor: pointer;
              padding: 12px 14px;
              font-weight: 700;
              user-select: none;
            }
            #forge-start-guide .forge-guide-body {
              padding: 0 14px 13px;
              color: #d7d7dd;
            }
            #forge-start-guide ol { margin: 8px 0 0 20px; padding: 0; }
            #forge-start-guide li { margin: 5px 0; }
            #forge-start-guide code {
              padding: 1px 4px;
              border-radius: 5px;
              background: rgba(255,255,255,.09);
              color: inherit;
            }
            @media (max-width: 720px) {
              #forge-lang-switch { top: 8px; right: 8px; }
              #forge-start-guide { right: 8px; bottom: 8px; width: calc(100vw - 16px); }
            }
          </style>

          <div id="forge-lang-switch" role="group" aria-label="Dashboard language / Язык Dashboard">
            <button type="button" data-forge-lang="en" aria-pressed="false">EN</button>
            <button type="button" data-forge-lang="ru" aria-pressed="false">RU</button>
          </div>

          <aside id="forge-start-guide" aria-label="Getting started">
            <details>
              <summary data-forge-i18n="guide_title">Start here — what to do next</summary>
              <div class="forge-guide-body">
                <div data-forge-i18n="guide_intro">For a new game or app, use the Dashboard as the starting point.</div>
                <ol>
                  <li data-forge-i18n="guide_1">Create a new project or select an existing one.</li>
                  <li data-forge-i18n="guide_2">Check the current Forge phase and recommended next action.</li>
                  <li data-forge-i18n="guide_3">Choose a terminal agent profile: Claude Code, Codex or GigaChat.</li>
                  <li data-forge-i18n="guide_4">Run the task in the terminal; Forge keeps the shared project state.</li>
                  <li data-forge-i18n="guide_5">Return here to review status and continue through the 9-phase lifecycle.</li>
                </ol>
              </div>
            </details>
          </aside>

          <script id="forge-dashboard-i18n">
          (() => {
            'use strict';

            const STORAGE_KEY = 'forge-dashboard-language';
            const phrases = {
              guide_title: { en: 'Start here — what to do next', ru: 'Начните здесь — что делать дальше' },
              guide_intro: { en: 'For a new game or app, use the Dashboard as the starting point.', ru: 'Для новой игры или приложения используйте Dashboard как стартовую точку.' },
              guide_1: { en: 'Create a new project or select an existing one.', ru: 'Создайте новый проект или выберите существующий.' },
              guide_2: { en: 'Check the current Forge phase and recommended next action.', ru: 'Проверьте текущую фазу Forge и рекомендуемый следующий шаг.' },
              guide_3: { en: 'Choose a terminal agent profile: Claude Code, Codex or GigaChat.', ru: 'Выберите профиль терминального агента: Claude Code, Codex или GigaChat.' },
              guide_4: { en: 'Run the task in the terminal; Forge keeps the shared project state.', ru: 'Выполните задачу в терминале; Forge сохранит общее состояние проекта.' },
              guide_5: { en: 'Return here to review status and continue through the 9-phase lifecycle.', ru: 'Вернитесь сюда, чтобы проверить статус и продолжить работу по 9-фазному циклу.' }
            };

            // Exact UI pairs. Technical provider/product names intentionally remain unchanged.
            const pairs = [
              ['Dashboard', 'Панель'],
              ['Projects', 'Проекты'],
              ['Project', 'Проект'],
              ['New project', 'Новый проект'],
              ['Create project', 'Создать проект'],
              ['Create a project', 'Создать проект'],
              ['Add project', 'Добавить проект'],
              ['Open project', 'Открыть проект'],
              ['Select project', 'Выбрать проект'],
              ['Select a project', 'Выберите проект'],
              ['Recent projects', 'Недавние проекты'],
              ['No projects yet', 'Проектов пока нет'],
              ['Create your first project', 'Создайте первый проект'],
              ['Project name', 'Название проекта'],
              ['Project path', 'Путь к проекту'],
              ['Game', 'Игра'],
              ['App', 'Приложение'],
              ['Create game', 'Создать игру'],
              ['Create app', 'Создать приложение'],
              ['New game', 'Новая игра'],
              ['New app', 'Новое приложение'],
              ['Status', 'Статус'],
              ['Current status', 'Текущий статус'],
              ['Phase', 'Фаза'],
              ['Current phase', 'Текущая фаза'],
              ['Next phase', 'Следующая фаза'],
              ['Next step', 'Следующий шаг'],
              ['Recommended next step', 'Рекомендуемый следующий шаг'],
              ['What to do next', 'Что делать дальше'],
              ['Instructions', 'Инструкция'],
              ['Quick start', 'Быстрый старт'],
              ['Getting started', 'Начало работы'],
              ['Recommended', 'Рекомендуется'],
              ['Start', 'Начать'],
              ['Continue', 'Продолжить'],
              ['Resume', 'Продолжить'],
              ['Launch', 'Запустить'],
              ['Launch agent', 'Запустить агента'],
              ['Agent', 'Агент'],
              ['Agents', 'Агенты'],
              ['Agent profiles', 'Профили агентов'],
              ['Profile', 'Профиль'],
              ['Available', 'Доступен'],
              ['Unavailable', 'Недоступен'],
              ['Installed', 'Установлен'],
              ['Not installed', 'Не установлен'],
              ['Ready', 'Готово'],
              ['Not ready', 'Не готово'],
              ['Setup', 'Настройка'],
              ['Settings', 'Настройки'],
              ['Refresh', 'Обновить'],
              ['Reload', 'Перезагрузить'],
              ['Save', 'Сохранить'],
              ['Cancel', 'Отмена'],
              ['Close', 'Закрыть'],
              ['Back', 'Назад'],
              ['Copy', 'Копировать'],
              ['Delete', 'Удалить'],
              ['Remove', 'Удалить'],
              ['Open', 'Открыть'],
              ['Details', 'Подробнее'],
              ['Show details', 'Показать подробности'],
              ['Hide details', 'Скрыть подробности'],
              ['Checks', 'Проверки'],
              ['Release', 'Релиз'],
              ['Release gates', 'Проверки релиза'],
              ['Documentation', 'Документация'],
              ['Activity', 'Активность'],
              ['History', 'История'],
              ['Last updated', 'Последнее обновление'],
              ['Path', 'Путь'],
              ['Name', 'Название'],
              ['Type', 'Тип'],
              ['Version', 'Версия'],
              ['Language', 'Язык'],
              ['English', 'Английский'],
              ['Russian', 'Русский'],
              ['Choose language', 'Выберите язык'],
              ['Create', 'Создать'],
              ['Next', 'Далее'],
              ['Previous', 'Назад'],
              ['Done', 'Готово'],
              ['Error', 'Ошибка'],
              ['Warning', 'Предупреждение'],
              ['Success', 'Успешно'],
              ['Loading…', 'Загрузка…'],
              ['Loading...', 'Загрузка...'],
              ['No data', 'Нет данных'],
              ['Unknown', 'Неизвестно']
            ];

            const dictionaries = { en: new Map(), ru: new Map() };
            for (const [en, ru] of pairs) {
              dictionaries.en.set(en, en);
              dictionaries.en.set(ru, en);
              dictionaries.ru.set(en, ru);
              dictionaries.ru.set(ru, ru);
            }

            const preserveSpace = (original, replacement) => {
              const lead = original.match(/^\s*/)?.[0] || '';
              const tail = original.match(/\s*$/)?.[0] || '';
              return lead + replacement + tail;
            };

            const translateValue = (value, lang) => {
              if (!value) return value;
              const trimmed = value.trim();
              const next = dictionaries[lang].get(trimmed);
              return next ? preserveSpace(value, next) : value;
            };

            const translateRoot = (root, lang) => {
              if (!root) return;

              if (root.nodeType === Node.TEXT_NODE) {
                const parent = root.parentElement;
                if (!parent || /^(SCRIPT|STYLE|CODE|PRE|TEXTAREA)$/i.test(parent.tagName)) return;
                root.nodeValue = translateValue(root.nodeValue, lang);
                return;
              }

              if (root.nodeType !== Node.ELEMENT_NODE && root.nodeType !== Node.DOCUMENT_NODE && root.nodeType !== Node.DOCUMENT_FRAGMENT_NODE) return;

              if (root.nodeType === Node.ELEMENT_NODE) {
                for (const attr of ['title', 'placeholder', 'aria-label']) {
                  if (root.hasAttribute?.(attr)) {
                    root.setAttribute(attr, translateValue(root.getAttribute(attr), lang));
                  }
                }
              }

              const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
              let node;
              while ((node = walker.nextNode())) {
                const parent = node.parentElement;
                if (!parent || /^(SCRIPT|STYLE|CODE|PRE|TEXTAREA)$/i.test(parent.tagName)) continue;
                node.nodeValue = translateValue(node.nodeValue, lang);
              }

              root.querySelectorAll?.('[title],[placeholder],[aria-label]').forEach((el) => {
                for (const attr of ['title', 'placeholder', 'aria-label']) {
                  if (el.hasAttribute(attr)) el.setAttribute(attr, translateValue(el.getAttribute(attr), lang));
                }
              });
            };

            let currentLang = 'en';
            let scheduled = false;

            const applyLanguage = (lang, persist = true) => {
              currentLang = lang === 'ru' ? 'ru' : 'en';
              document.documentElement.lang = currentLang;
              document.querySelectorAll('[data-forge-i18n]').forEach((el) => {
                const entry = phrases[el.dataset.forgeI18n];
                if (entry) el.textContent = entry[currentLang];
              });
              document.querySelectorAll('#forge-lang-switch [data-forge-lang]').forEach((button) => {
                button.setAttribute('aria-pressed', button.dataset.forgeLang === currentLang ? 'true' : 'false');
              });
              translateRoot(document.body, currentLang);
              if (persist) {
                try { localStorage.setItem(STORAGE_KEY, currentLang); } catch (_) {}
              }
            };

            document.querySelectorAll('#forge-lang-switch [data-forge-lang]').forEach((button) => {
              button.addEventListener('click', () => applyLanguage(button.dataset.forgeLang));
            });

            const observer = new MutationObserver((records) => {
              if (scheduled) return;
              const relevant = records.some((r) => r.addedNodes && r.addedNodes.length);
              if (!relevant) return;
              scheduled = true;
              queueMicrotask(() => {
                scheduled = false;
                for (const record of records) {
                  for (const node of record.addedNodes || []) translateRoot(node, currentLang);
                }
              });
            });
            observer.observe(document.body, { childList: true, subtree: true });

            let saved = null;
            try { saved = localStorage.getItem(STORAGE_KEY); } catch (_) {}
            const initial = saved === 'ru' || saved === 'en'
              ? saved
              : ((navigator.language || '').toLowerCase().startsWith('ru') ? 'ru' : 'en');
            applyLanguage(initial, false);
          })();
          </script>
          '''
              if '</body>' not in html.lower():
                  raise SystemExit('dashboard.html has no </body> marker')
              idx = html.lower().rfind('</body>')
              html = html[:idx] + block + '\n' + html[idx:]
              path.write_text(html, encoding='utf-8')
          PY
          fi

          python3 - <<'PY'
          from pathlib import Path

          en = Path('README.md')
          text = en.read_text(encoding='utf-8')
          marker = '## Recommended: start with the Dashboard'
          if marker not in text:
              anchor = 'Then launch the terminal host you want to use.\n'
              section = '''\n## Recommended: start with the Dashboard\n\nFor a new game or app, the recommended entry point is [`dashboard.html`](dashboard.html). Open it locally after setup: the Dashboard is the control center for creating or opening projects and for seeing what to do next.\n\n1. Open `dashboard.html` in your browser.\n2. Choose **EN** or **RU** in the Dashboard.\n3. Create a new game/app or select an existing project.\n4. Follow the current Forge phase and the recommended next action.\n5. Launch Claude Code, Codex or GigaChat with the profile you want and continue through the same 9-phase workflow.\n\nThe terminal remains the execution environment; the Dashboard is the recommended starting point and navigation layer for project status, agent profiles, phase progress and next steps.\n'''
              if anchor not in text:
                  raise SystemExit('English README quick-start anchor not found')
              text = text.replace(anchor, anchor + section, 1)
          if '- [ROADMAP.md](ROADMAP.md)' not in text:
              docs_anchor = '- [CONTRIBUTING.md](CONTRIBUTING.md) — contribution guide\n'
              text = text.replace(docs_anchor, docs_anchor + '- [ROADMAP.md](ROADMAP.md) — public development direction\n', 1)
          en.write_text(text, encoding='utf-8')

          ru = Path('README_RU.md')
          text = ru.read_text(encoding='utf-8')
          marker = '## Рекомендуемый старт: Dashboard'
          if marker not in text:
              anchor = 'После установки запускается нужный terminal host.\n'
              section = '''\n## Рекомендуемый старт: Dashboard\n\nДля новой игры или приложения лучше всего начинать с [`dashboard.html`](dashboard.html). Откройте его локально после установки: Dashboard служит точкой входа для создания или выбора проекта и сразу показывает, что делать дальше.\n\n1. Откройте `dashboard.html` в браузере.\n2. Выберите **RU** или **EN** в Dashboard.\n3. Создайте новую игру/приложение или выберите существующий проект.\n4. Следуйте текущей фазе Forge и рекомендуемому следующему действию.\n5. Запустите Claude Code, Codex или GigaChat с нужным профилем и продолжайте работу в общем 9-фазном процессе.\n\nТерминал остаётся средой выполнения задач, а Dashboard — рекомендуемой стартовой точкой и навигационным слоем: здесь видны состояние проекта, профили агентов, прогресс по фазам и следующий шаг.\n'''
              if anchor not in text:
                  raise SystemExit('Russian README quick-start anchor not found')
              text = text.replace(anchor, anchor + section, 1)
          if '- [ROADMAP.md](ROADMAP.md)' not in text:
              docs_anchor = '- [CONTRIBUTING.md](CONTRIBUTING.md) — правила contribution\n'
              text = text.replace(docs_anchor, docs_anchor + '- [ROADMAP.md](ROADMAP.md) — публичное направление развития\n', 1)
          ru.write_text(text, encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          dashboard = Path('dashboard.html').read_text(encoding='utf-8')
          readme = Path('README.md').read_text(encoding='utf-8')
          readme_ru = Path('README_RU.md').read_text(encoding='utf-8')
          if 'FORGE_DASHBOARD_BILINGUAL_V1' not in dashboard and 'forge-dashboard-language' not in dashboard:
              raise SystemExit('bilingual Dashboard marker missing')
          if 'dashboard.html' not in readme or '## Recommended: start with the Dashboard' not in readme:
              raise SystemExit('English Dashboard onboarding missing')
          if 'dashboard.html' not in readme_ru or '## Рекомендуемый старт: Dashboard' not in readme_ru:
              raise SystemExit('Russian Dashboard onboarding missing')
          print('Dashboard bilingual onboarding checks passed')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/dashboard-bilingual.yml
          git add dashboard.html README.md README_RU.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "feat: make Dashboard bilingual and promote guided onboarding"
          git push origin HEAD:main
