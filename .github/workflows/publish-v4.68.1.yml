name: Publish v4.68.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v4.68.1.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create v4.68.1 tag and release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          target = "dbb95f2827f925e67f1049682c3a78427bb65d56"
          tag = "v4.68.1"
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "project-forge-release-workflow",
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(api + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  body = json.loads(raw) if raw else None
                  return exc.code, body

          status, _ = request("GET", f"/git/ref/tags/{urllib.parse.quote(tag, safe='')}")
          if status == 404:
              status, body = request("POST", "/git/refs", {"ref": f"refs/tags/{tag}", "sha": target})
              if status != 201:
                  raise SystemExit(f"tag creation failed: HTTP {status}: {body}")
          elif status != 200:
              raise SystemExit(f"tag lookup failed: HTTP {status}")

          status, _ = request("GET", f"/releases/tags/{urllib.parse.quote(tag, safe='')}")
          if status == 404:
              status, file_info = request("GET", f"/contents/RELEASE_NOTES_v4.68.1.md?ref={target}")
              if status != 200:
                  raise SystemExit(f"release notes fetch failed: HTTP {status}: {file_info}")
              notes = base64.b64decode(file_info["content"]).decode("utf-8")
              status, body = request("POST", "/releases", {
                  "tag_name": tag,
                  "target_commitish": target,
                  "name": "Project Forge v4.68.1",
                  "body": notes,
                  "draft": False,
                  "prerelease": False,
              })
              if status != 201:
                  raise SystemExit(f"release creation failed: HTTP {status}: {body}")
          elif status != 200:
              raise SystemExit(f"release lookup failed: HTTP {status}")
          PY
