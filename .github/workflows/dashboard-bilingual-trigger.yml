name: Trigger bilingual Dashboard update

on:
  push:
    branches:
      - main
    paths:
      - .github/dashboard-bilingual-trigger.txt

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger prepared Dashboard workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f .github/workflows/dashboard-bilingual.yml ]; then
            printf '\n# one-shot trigger\n' >> .github/workflows/dashboard-bilingual.yml
          fi

          git rm -f .github/dashboard-bilingual-trigger.txt
          git rm -f .github/workflows/dashboard-bilingual-trigger.yml
          git add .github/workflows/dashboard-bilingual.yml 2>/dev/null || true

          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: trigger bilingual Dashboard update"
          git push origin HEAD:main
