<!doctype html>
<meta charset="utf-8">
<style>html,body,canvas{margin:0;width:100%;height:100%;display:block;background:#111}</style>
<canvas id="game"></canvas>
<script src="/sdk.js"></script>
<script>
  const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'); let state=location.search?'qa-only':(localStorage.getItem('forge-state')||'menu'),sdk=null;
  YaGames.init().then(value=>{sdk=value; sdk.features.LoadingAPI.ready()});
  function setState(next){state=next;localStorage.setItem('forge-state',state)}
  function draw(){canvas.width=innerWidth;canvas.height=innerHeight;ctx.fillStyle=state==='menu'?'#246':state==='play'?'#264':'#624';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.font='48px sans-serif';ctx.fillText(state,80,100);requestAnimationFrame(draw)}draw();
  canvas.addEventListener('pointerdown',event=>{if(event.clientX<80&&event.clientY<80)return;if(state==='menu'){setState('play');sdk?.features.GameplayAPI.start()}});
  addEventListener('keydown',event=>{if(event.code==='Space'&&state==='play'){setState('result');sdk?.features.GameplayAPI.stop();sdk?.adv.showRewardedVideo()}});
  window.__FORGE_PLAYTEST__=Object.freeze({listStates:()=>['menu','play','result'],currentState:()=>state});
</script>
