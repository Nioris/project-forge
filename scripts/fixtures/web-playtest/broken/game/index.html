<!doctype html>
<meta charset="utf-8">
<style>html,body,canvas{margin:0;width:100%;height:100%;display:block;background:#111}</style>
<canvas id="game"></canvas>
<script>
  const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'); let state='menu';
  function draw(){canvas.width=innerWidth;canvas.height=innerHeight;ctx.fillStyle='#246';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.font='48px sans-serif';ctx.fillText(state,80,100);requestAnimationFrame(draw)}draw();
  canvas.addEventListener('pointerdown',()=>{state='menu'}); addEventListener('keydown',()=>{state='menu'});
  window.__FORGE_PLAYTEST__=Object.freeze({listStates:()=>['menu','play','result'],currentState:()=>state});
</script>
