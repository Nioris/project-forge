<!--
  @file vk-init-snippet.html
  @description Шаблон index.html для VK Mini App. Правильный порядок загрузки:
               1. Meta + <base href="./"> для относительных путей
               2. VK Bridge (CDN)
               3. vk-bridge-wrapper.js
               4. Игровой код
               5. VKApp.init() ПЕРВЫМ действием после DOM ready

  Скопируйте в проект и заполните места, помеченные <!-- TODO: ... -->.
-->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- dvh — динамический viewport для правильной высоты на iOS / Android -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0077ff">

  <!-- КРИТИЧНО: относительные пути. Без этого проксирование VK ломает загрузку. -->
  <base href="./">

  <title><!-- TODO: Название приложения --></title>

  <style>
    /* Фиксация экрана — блокирует pull-to-refresh и overscroll на iOS */
    html, body {
      margin: 0; padding: 0;
      overflow: hidden;
      position: fixed;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #app, #game, canvas {
      display: block;
      width: 100vw;
      height: 100dvh;
      touch-action: none;
    }
    /* Splash до VKWebAppInit — модерация видит нейтральный экран, а не белый */
    #splash {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #17181a; color: #fff;
      font: 16px system-ui, -apple-system, sans-serif;
      z-index: 9999;
    }
    body[data-theme="light"] #splash { background: #f5f5f5; color: #000; }
  </style>
</head>

<body>
  <div id="splash">Загрузка…</div>
  <div id="app">
    <!-- TODO: игровой контент / canvas -->
    <canvas id="game"></canvas>
  </div>

  <!-- 1. VK Bridge (всегда из CDN ВК или npm-бандла). Не ставим пинованную версию
       в копипастном сценарии — @latest обновляется VK. Если проект на bundler-е —
       используйте import '@vkontakte/vk-bridge'. -->
  <script src="https://unpkg.com/@vkontakte/vk-bridge@latest/dist/browser.min.js"></script>

  <!-- 2. Наша обёртка с dev-fallback и правильной очередью -->
  <script src="vk-bridge-wrapper.js"></script>

  <!-- 3. Игровой код -->
  <!-- <script src="game.js"></script> -->

  <!-- 4. Запуск -->
  <script>
    (async () => {
      // ОБЯЗАТЕЛЬНО первым — иначе мобильные клиенты ВК не откроют приложение
      const env = await VKApp.init();

      // Применить язык ДО рендера UI
      document.documentElement.lang = env.lang;
      document.body.dir = ['ar','he','fa'].includes(env.lang) ? 'rtl' : 'ltr';

      // Применить тему (VK сам пришлёт VKWebAppUpdateConfig чуть позже,
      // но на десктопе бывает без события — выставим из query)
      const initialScheme = new URLSearchParams(location.search).get('vk_scheme') || 'bright_light';
      document.body.dataset.theme = /dark|space_gray/.test(initialScheme) ? 'dark' : 'light';

      // Подписаться на смену темы
      VKApp.setOnThemeChange((mode) => {
        document.body.dataset.theme = mode;
      });

      // Колбэки для пауз (заглушки — замените на свои)
      VKApp.setOnPause(() => {
        // TODO: gameLoop.pause(); sound.mute(); cancelAnimationFrame(rafId);
        console.log('[game] paused');
      });
      VKApp.setOnResume(() => {
        // TODO: lastTime = performance.now(); sound.unmute(); rafId = requestAnimationFrame(loop);
        console.log('[game] resumed');
      });

      // Блокировка контекстного меню и выделения — требуется правилами
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('selectstart', e => e.preventDefault());
      document.addEventListener('touchmove', e => {
        if (e.target.closest('#game, canvas, #app')) e.preventDefault();
      }, { passive: false });

      // Предпроверка rewarded — скроем кнопку если недоступно
      const rewardedOk = await VKApp.checkRewarded();
      if (!rewardedOk) {
        document.querySelectorAll('[data-rewarded]').forEach(el => { el.style.display = 'none'; });
      }

      // Убрать splash когда игра готова к рендеру
      document.getElementById('splash')?.remove();

      // TODO: startGame();
    })().catch(err => {
      console.error('[VK] init failed:', err);
      document.getElementById('splash').textContent = 'Ошибка загрузки. Перезапустите приложение.';
    });
  </script>
</body>
</html>
