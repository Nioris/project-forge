нном wrapper'е (WebView-специфика: file:// пути, touch).\n4. Отчёт: что адаптировано, версии SDK, деградации, APK путь. Никаких «должно работать» —\n   каждый пункт = вывод команды.\n\n## IAP-слой (гибридная модель) — если игра зарабатывает на платежах\n1. **Pay SDK** (не старый billing): каталог товаров заводится в Консоли RuStore, id товаров —\n   латиницей, в коде через конфиг, не хардкодом.\n2. **Валидация на сервере ОБЯЗАТЕЛЬНА**: клиент получает чек → отправляет на бэкенд →\n   бэкенд проверяет его у RuStore → только после этого выдаёт товар и пишет в БД.\n   Клиентское «я купил» = подделка на первой неделе. Без валидации сдавать нельзя.\n3. **Идемпотентность**: повторная отправка одного чека не должна выдавать товар дважды\n   (уникальный индекс по id покупки в БД).\n4. **Восстановление покупок** после переустановки — обязательный пункт для непотребляемых.\n5. Платящему **не показывать рекламу** (флаг в профиле игрока, приходит с сервера).\n6. Проверка перед сдачей: тестовый платёж в Консоли проходит; подделанный чек → отказ;\n   повторная отправка чека → товар выдан один раз.\n⚠️ Платежи доступны только ИП/юрлицу (с 01.02.2026) — статус подтверждается ДО начала работ."
